spring:
  application:
    name: cloudvault

  # Where the database is
  datasource:
    url: jdbc:postgresql://localhost:5432/cloudvault
    username: cloudvault
    password: localdev123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB         # Max upload size per file
      max-request-size: 50MB

  # SMTP — set SMTP_HOST/USERNAME/PASSWORD env vars in real environments.
  # For Gmail: host=smtp.gmail.com, port=587, username=<email>, password=<app password>
  # When SMTP_HOST is empty the MailService logs the reset link instead of sending.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Custom properties
cloudvault:
  storage:
    location: ./uploads           # Where files are stored locally
  jwt:
    secret: 3e7f7b4d834132a032c30fc8e027189c9b98128e5aec1660c73b7fcba8d28afc
    expiration: 86400000          # 24 hours in milliseconds
  mail:
    from: ${MAIL_FROM:no-reply@cloudvault.app}
    from-name: ${MAIL_FROM_NAME:CloudVault}
  app:
    base-url: ${APP_BASE_URL:http://localhost:5173}
  reset:
    token-ttl-minutes: 30

server:
  port: 8080
